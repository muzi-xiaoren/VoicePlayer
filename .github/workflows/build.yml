name: Build Windows

# push 到 main / 手动触发：构建并上传可下载 artifact。
# 推 v 开头的 tag（如 v0.0.1）：额外把绿色版 zip + 安装包发到 Release。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      # 静态链接 CRT，产物是单个 exe，用户机器无需装 VC 运行库。
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/voiceplayer.exe dist/VoicePlayer.exe
          Compress-Archive -Path dist/VoicePlayer.exe -DestinationPath VoicePlayer-Windows.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iss = @"
          [Setup]
          AppId={{B7F2C1A4-9D3E-4C6B-8A15-3E9D2C1A4F60}
          AppName=VoicePlayer
          AppVersion=$version
          AppPublisher=muzi-xiaoren
          DefaultDirName={autopf}\VoicePlayer
          DefaultGroupName=VoicePlayer
          OutputDir=$env:GITHUB_WORKSPACE
          OutputBaseFilename=VoicePlayer-Setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "$env:GITHUB_WORKSPACE\target\release\voiceplayer.exe"; DestDir: "{app}"; DestName: "VoicePlayer.exe"; Flags: ignoreversion

          [Icons]
          Name: "{group}\VoicePlayer"; Filename: "{app}\VoicePlayer.exe"
          Name: "{autodesktop}\VoicePlayer"; Filename: "{app}\VoicePlayer.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加图标:"; Flags: unchecked

          [Run]
          Filename: "{app}\VoicePlayer.exe"; Description: "启动 VoicePlayer"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: VoicePlayer-Windows
          path: |
            VoicePlayer-Windows.zip
            VoicePlayer-Setup.exe
          if-no-files-found: error

  release:
    name: Publish Release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          cp artifacts/VoicePlayer-Windows/VoicePlayer-Windows.zip release/
          cp artifacts/VoicePlayer-Windows/VoicePlayer-Setup.exe   release/
          ls -lh release

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## 📦 下载

            | 文件 | 说明 |
            |---|---|
            | **VoicePlayer-Setup.exe** | 推荐，安装版（会创建桌面快捷方式） |
            | VoicePlayer-Windows.zip | 免安装绿色版，解压即用 |

            ---

            ## 🎮 这是什么

            VoicePlayer 是一个轻量级 Windows 声卡音效热键工具（类似 Soundpad）。
            按下全局快捷键，把音效混进麦克风——开黑的人就能听到你的音效，**同时不影响你正常说话**。

            适用场景：游戏开黑、Discord 语音、直播等需要往麦克风里灌音效的场景。

            ---

            ## 🔧 首次使用（4 步搞定）

            ### 第 1 步：安装 VB-CABLE 虚拟声卡（必须）

            VB-CABLE 是一根免费的「虚拟音频管道」，VoicePlayer 的音效通过它送到游戏麦克风。

            1. 打开 [VB-CABLE 下载页](https://vb-audio.com/Cable/)，下载并解压
            2. 右键 `VBCABLE_Setup_x64.exe` → **以管理员身份运行**
            3. 点 **Install Driver**，安装完成后**重启电脑**

            ### 第 2 步：设置 VoicePlayer

            打开 VoicePlayer，在顶部设置区：

            | 设置项 | 填什么 |
            |---|---|
            | **输出设备** | `CABLE Input (VB-Audio Virtual Cable)` |
            | **麦克风** | 你的真实麦克风（或保持系统默认） |

            ### 第 3 步：设置游戏 / Discord 的麦克风

            在游戏或 Discord 的音频设置里，把**麦克风设备**改成：

            > `CABLE Output (VB-Audio Virtual Cable)`

            这样游戏收到的声音 = 你说话 + 你放的音效。

            ### 第 4 步：加入音效 + 绑定快捷键

            1. 点 **「打开文件夹」**，把 mp3 / wav / ogg 等音频文件拖进去
            2. 回到 VoicePlayer，音频会自动出现在列表里
            3. 点每个音效右边的 **「设快捷键」**，按下你想要的键即可
            4. 开始使用！在游戏里按快捷键就能放音效了

            ---

            ## ✨ 功能一览

            - **多音效混播**：多个音效可同时播放，互不干扰
            - **主键盘 / 小键盘独立绑定**：数字键 1 和小键盘 1 可绑成不同音效
            - **一键锁定**：锁定后快捷键不再触发，避免误触
            - **重复按键行为三选一**：从头重播 / 叠加再播 / 一按播再按停
            - **耳机监听**：可选监听设备，让自己也能听到音效
            - **多语言**：中文 / English，默认跟随系统语言
            - **开机自启**：可设置开机自动启动
            - **系统音频捕获**：可把系统正在播放的声音（音乐、视频等）混入虚拟麦克风
            - **窗口位置记忆**：下次打开自动恢复上次的位置和大小
            - **不拦截按键**：绑定的键仍能正常打字，不会吞键

            ---

            ## 💡 常见问题

            **Q：游戏里听不到音效？**
            → 检查 VoicePlayer 的输出设备是否选了 CABLE Input，游戏麦克风是否选了 CABLE Output。

            **Q：关掉 VoicePlayer 后游戏没声音了？**
            → 因为游戏麦克风设成了 CABLE Output，VoicePlayer 需要一直开着转发你的麦克风。可勾选开机自启动。

            **Q：下载 exe 时 Windows 提示有病毒 / SmartScreen？**
            → 这是 Windows 对未签名程序的通用警告。点「更多信息」→「仍要运行」即可。本程序开源，代码可在 GitHub 查看。

            **Q：绑定的快捷键在游戏全屏时没用？**
            → VoicePlayer 使用 Windows 低级键盘钩子，全屏独占游戏也能工作。如果不行请确认游戏没有以管理员权限运行（以管理员权限运行的程序无法接收低权限程序的钩子）。

            ---

            > 配置和音频文件存放在 `%APPDATA%\VoicePlayer\profiles\` 目录下。
